<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Formulario Interativo</title>
</head>
<body>

    <section class="container-pai">
        <div class="card loginActive">
            <div class="esquerda">
                <div class="form-login">
                    <h2>Fazer login</h2>

                    <form class="form">

                    <input 
                    type="email" 
                    id="email" 
                    placeholder="Email" 
                    required>

                    <input 
                    type="password"
                    id="password"
                    placeholder="Senha"
                    required>

                    <button type="submit"> <p>Entrar</p></button>
                    </form>
                 </div>
                 <div class="facalogin">
                    <h2>Já tem <br> uma conta?</h2>
                    <p>Lorem ipsum dolor sit amet consectetur 
                        adipisicing elit. Minus cumque ipsam.
                    </p>
                    <button id="btn-facalogin" type="submit"> <p>Fazer login</p></button>
                 </div>
             </div>
             <div class="direita">
                <div class="form-cadastro">
                    <h2>Cadastre-se</h2>

                    <form class="form-cadastro">

                    <input 
                    type="text" 
                    id="nome" 
                    placeholder="Nome" 
                    required>

                    <input 
                    type="email" 
                    id="email" 
                    placeholder="Email" 
                    required>

                    <input 
                    type="password"
                    id="password"
                    placeholder="Senha"
                    required>

                    <input 
                    type="password"
                    id="confirm-password"
                    placeholder="Confirmar Senha"
                    required>

                    <button id="btn-cadastrar" type="submit"><p>Cadastrar</p></button>
                    </form>
                 </div>
                 <div class="facadastro">
                    <h2>Não tem <br> uma conta?</h2>
                    <p>Lorem ipsum dolor sit amet consectetur 
                        adipisicing elit. Minus cumque ipsam adipisci.
                    </p>
                    <button id="btn-facadastro" type="submit"><p>Cadastrar</p></button>
                 </div>
             </div>
             <div class="fundo">

             </div>
         </div>
    </section>

   
</body>
</html>
